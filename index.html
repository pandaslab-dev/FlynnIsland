<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flynn Island</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      min-height: 100svh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #1a1a1a;  /* Dark background around canvas */
    }

    canvas {
      touch-action: none;
    }
    
    /* Style the name input placeholder text */
    #nameInput::placeholder {
      color: rgba(0, 0, 0, 0.4);  /* Semi-transparent black */
      font-style: italic;
    }
  </style>
  
  <!-- Load Phaser library from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.js"></script>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body>
  <!-- 
    Load all scene files BEFORE main.js
    Order matters! Each scene class must exist before main.js tries to use it
  -->
  <script src="src/utils/ViewportScaler.js"></script>
  <script src="src/scenes/TitleScene.js"></script>
  <script src="src/scenes/NameInputScene.js"></script>
  <script src="src/scenes/DogSelectScene.js"></script>
  <script src="src/net/FlynnNetworkBridge.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  
  <!-- Load main config last - this starts the game -->
  <script src="src/main.js"></script>
</body>
</html>
